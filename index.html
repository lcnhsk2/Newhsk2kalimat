                    { word: "高中", pinyin: "gāozhōng", meaning: "SMA", sentence: "我和他从___开始就是好朋友。", sentenceMeaning: "Saya dan dia sejak SMA sudah menjadi teman baik." },
                    { word: "出门", pinyin: "chūmén", meaning: "pergi keluar rumah", sentence: "今天下雨，___记得带伞。", sentenceMeaning: "Hari ini hujan, keluar rumah ingat membawa payung." },
                    { word: "路", pinyin: "lù", meaning: "jalan", sentence: "这条___上有很多餐厅。", sentenceMeaning: "Di jalanan ini ada banyak restoran." },
                    { word: "颐和园", pinyin: "Yíhéyuán", meaning: "Istana Musim Panas (Summer Palace)", sentence: "去北京旅游一定要去___。", sentenceMeaning: "Jalan-jalan ke Beijing harus pergi ke Summer Palace." },
                    { word: "机场", pinyin: "jīchǎng", meaning: "bandara", sentence: "我们坐出租车去___接人。", sentenceMeaning: "Kami naik taksi pergi ke bandara menjemput orang." },
                    { word: "机票", pinyin: "jīpiào", meaning: "tiket pesawat", sentence: "我已经在网上买好了来回___。", sentenceMeaning: "Saya sudah membeli tiket pesawat pulang pergi di internet." },
                    { word: "飞", pinyin: "fēi", meaning: "terbang", sentence: "小鸟在蓝色的天空里___。", sentenceMeaning: "Burung kecil terbang di langit biru." },
                    { word: "好像", pinyin: "hǎoxiàng", meaning: "sepertinya / mirip", sentence: "外面___下雨了，听听声音。", sentenceMeaning: "Di luar sepertinya turun hujan, dengarkan suaranya." },
                    { word: "鸟", pinyin: "niǎo", meaning: "burung", sentence: "树上有一只可爱的小___在叫。", sentenceMeaning: "Di atas pohon ada seekor burung kecil imut sedang berkicau." }
                ]
            }
        ];

        // --- GAME STATE ---
        let currentLesson = null;
        let currentQuestions = [];
        let score = 0;
        let wrongCount = 0;
        let timeRemaining = 0;
        let timerInterval;
        let gameState = 'menu'; // 'menu', 'playing', 'checking', 'result', 'review'
        
        let userAnswers = [];
        let activeBlankIndex = null;
        let shuffledAvailableWordsCache = []; // To maintain shuffled order across re-renders
        
        // Dynamic Colorful Backgrounds
        const bgGradients = [
            'from-pink-200 to-rose-300',
            'from-sky-200 to-blue-300',
            'from-emerald-200 to-teal-300',
            'from-amber-200 to-orange-300',
            'from-purple-200 to-fuchsia-300',
            'from-cyan-200 to-indigo-300'
        ];

        function setAppBackground(index) {
            const baseClasses = "notranslate text-slate-800 flex flex-col min-h-screen font-sans overflow-hidden bg-gradient-to-br ";
            const gradient = index === -1 ? "from-indigo-100 to-purple-200" : bgGradients[index % bgGradients.length];
            document.body.className = baseClasses + gradient;
        }
        
        // Tone.js Synths
        let synth, failSynth;

        // DOM Elements
        const gameContainer = document.getElementById('game-container');
        const warningModal = document.getElementById('warning-modal');

        // --- ANTI-CHEAT MECHANISMS ---
        
        // Disable shortcuts (Copy, Paste, PrintScreen)
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'p')) || 
                e.key === 'F12' || 
                e.key === 'PrintScreen') {
                e.preventDefault();
                showWarning();
            }
        });

        // Detect tab switching or window losing focus
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameState === 'playing') {
                showWarning();
            }
        });
        window.addEventListener('blur', () => {
            if (gameState === 'playing') {
                showWarning();
            }
        });

        function showWarning() {
            if(gameState === 'playing') {
                warningModal.classList.remove('hidden');
            }
        }

        function dismissWarning(forceExit) {
            warningModal.classList.add('hidden');
            if (forceExit && gameState === 'playing') {
                submitQuiz(true); // true means forced exit
            }
        }

        // --- AUDIO FUNCTIONS ---
        async function initAudio() {
            if (!synth) {
                await Tone.start();
                synth = new Tone.Synth({
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 1 }
                }).toDestination();
                
                failSynth = new Tone.Synth({
                    oscillator: { type: 'sawtooth' },
                    envelope: { attack: 0.05, decay: 0.2, sustain: 0, release: 0.2 }
                }).toDestination();
            }
        }

        function playCorrectSound() {
            if(synth) synth.triggerAttackRelease("C6", "16n");
        }

        function playWrongSound() {
            if(failSynth) failSynth.triggerAttackRelease("G3", "8n");
        }

        function playFinishSound(goodScore) {
            if (!synth) return;
            const now = Tone.now();
            if (goodScore) {
                synth.triggerAttackRelease("C5", "8n", now);
                synth.triggerAttackRelease("E5", "8n", now + 0.2);
                synth.triggerAttackRelease("G5", "4n", now + 0.4);
                synth.triggerAttackRelease("C6", "2n", now + 0.6);
            } else {
                failSynth.triggerAttackRelease("C4", "4n", now);
                failSynth.triggerAttackRelease("F#3", "4n", now + 0.3);
                failSynth.triggerAttackRelease("C3", "2n", now + 0.6);
            }
        }

        // --- UTILITY FUNCTIONS ---
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- UI RENDERING ---

        function renderMainMenu() {
            gameState = 'menu';
            setAppBackground(-1); // Reset to default bright theme
            let html = `
                <div class="flex flex-col h-full items-center justify-center p-6 animate-fade-in w-full">
                    <h1 class="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-4 drop-shadow-sm text-center">HSK 2 词汇挑战</h1>
                    <p class="text-slate-600 mb-8 max-w-2xl text-center text-sm md:text-base leading-relaxed font-medium">
                        Pilih bab untuk memulai kuis. <strong>Jodohkan kata</strong> yang tepat untuk melengkapi semua kalimat sebelum waktu habis.<br>
                        <span class="text-red-500 font-bold bg-red-50 px-2 py-1 rounded-md inline-block mt-2 border border-red-200">Dilarang keluar halaman, curang, atau berpindah tab!</span>
                    </p>
                    <div class="w-full max-w-5xl grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
            `;
            
            quizData.forEach((lesson, index) => {
                const btnColors = [
                    'bg-pink-100 hover:bg-pink-200 border-pink-300 text-pink-800',
                    'bg-blue-100 hover:bg-blue-200 border-blue-300 text-blue-800',
                    'bg-emerald-100 hover:bg-emerald-200 border-emerald-300 text-emerald-800',
                    'bg-amber-100 hover:bg-amber-200 border-amber-300 text-amber-800',
                    'bg-purple-100 hover:bg-purple-200 border-purple-300 text-purple-800'
                ];
                const colorClass = btnColors[index % btnColors.length];

                html += `
                    <button onclick="startLesson(${index})" 
                            class="${colorClass} border font-semibold py-3 px-3 rounded-xl transition duration-200 transform hover:-translate-y-1 hover:shadow-lg shadow-sm flex flex-col items-center group">
                        <span class="text-lg font-black mb-1 drop-shadow-sm">Bab ${lesson.lesson}</span>
                        <span class="text-xs truncate w-full text-center opacity-80 font-medium">${lesson.title}</span>
                        <span class="text-[10px] bg-white/60 px-2 py-1 rounded-full mt-2 font-bold group-hover:bg-white/80 transition-colors">${lesson.words.length} Kata</span>
                    </button>
                `;
            });

            html += `</div></div>`;
            gameContainer.innerHTML = html;
        }

        async function startLesson(lessonIndex) {
            await initAudio(); 
            
            currentLesson = quizData[lessonIndex];
            setAppBackground(lessonIndex);
            
            currentQuestions = shuffleArray(currentLesson.words).map(w => ({
                answer: w.word,
                sentence: w.sentence,
                pinyin: w.pinyin,
                meaning: w.meaning,
                sentenceMeaning: w.sentenceMeaning
            }));
            
            userAnswers = new Array(currentQuestions.length).fill(null);
            activeBlankIndex = null;
            
            const allWords = currentQuestions.map(q => q.answer);
            shuffledAvailableWordsCache = shuffleArray([...allWords]);
            
            score = 0;
            wrongCount = 0;
            timeRemaining = currentQuestions.length * 10; 
            gameState = 'playing';
            
            renderQuiz();
            startTimer();
        }

        function renderQuiz() {
            if (gameState !== 'playing' && gameState !== 'checking') return;

            const availableWords = shuffledAvailableWordsCache.filter(w => !userAnswers.includes(w));

            let sentencesHtml = currentQuestions.map((q, i) => {
                const formattedSentence = q.sentence.split('___');
                const isFilled = userAnswers[i] !== null;
                const wordInSlot = userAnswers[i] || '____';
                const isActive = activeBlankIndex === i;
                
                let slotClass = "inline-flex items-center justify-center min-w-[4rem] px-3 py-1 mx-1 border-b-2 font-bold cursor-pointer blank-slot rounded-t-md shadow-inner ";
                
                if (gameState === 'playing') {
                    slotClass += isActive ? 'border-amber-400 text-amber-700 bg-amber-100 shadow-amber-200' : 
                                 isFilled ? 'border-blue-500 text-blue-700 bg-blue-100 hover:bg-rose-100 hover:border-rose-400 hover:text-rose-600' : 
                                 'border-slate-400 text-slate-400 bg-slate-50 hover:border-blue-300 hover:bg-blue-50';
                } else {
                    slotClass += ' border-slate-300 text-slate-500 bg-slate-100'; 
                }

                const onClickHandler = gameState === 'playing' ? 'onclick="handleBlankClick(' + i + ')"' : '';
                const titleText = isFilled && gameState === 'playing' ? 'Klik untuk menghapus kata' : 'Klik untuk memilih slot ini';

                return '<div class="sentence-row text-lg md:text-xl font-medium tracking-wide bg-white/70 hover:bg-white/95 shadow-sm p-4 rounded-xl border border-white flex items-center flex-wrap transition-all duration-200" id="row-' + i + '">' +
                            '<span class="mr-3 text-sm text-slate-400 font-black w-6 text-right">' + (i + 1) + '.</span>' +
                            '<span class="text-slate-700">' + formattedSentence[0] + '</span>' +
                            '<div id="slot-' + i + '" class="' + slotClass + '" ' + onClickHandler + ' title="' + titleText + '">' +
                                wordInSlot +
                            '</div>' +
                            '<span class="text-slate-700">' + formattedSentence[1] + '</span>' +
                        '</div>';
            }).join('');

            let wordsHtml = '';
            if (gameState === 'playing') {
                wordsHtml = availableWords.map(word => 
                    '<button onclick="handleWordClick(\'' + word + '\')" class="py-2.5 px-2 text-center bg-white hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 rounded-xl text-lg font-bold transition duration-150 shadow-sm hover:shadow active:scale-95 text-slate-700">' +
                        word +
                    '</button>'
                ).join('');
            } else {
                wordsHtml = '<div class="col-span-full text-center text-slate-500 mt-10 font-medium animate-pulse">Memeriksa jawaban...</div>';
            }

            const headerHtml = '<div class="h-16 bg-white/90 backdrop-blur-md border-b border-slate-200/60 flex items-center justify-between px-6 shrink-0 shadow-sm z-10">' +
                '<div class="text-slate-500 font-bold truncate mr-4 flex items-center">' +
                    '<span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm mr-3">Bab ' + currentLesson.lesson + '</span>' + 
                    '<span class="text-slate-800">' + currentLesson.title + '</span>' +
                '</div>' +
                '<div class="flex items-center space-x-4 shrink-0">' +
                    '<div id="timer-display" class="px-4 py-1.5 rounded-full bg-slate-100 font-mono text-xl font-black border-2 ' + (timeRemaining <= 10 ? 'time-warning text-red-600 border-red-500 bg-red-50' : 'text-blue-600 border-blue-200') + '">' +
                        formatTime(timeRemaining) +
                    '</div>' +
                    '<button onclick="submitQuiz(false)" class="bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-600 hover:to-indigo-600 text-white font-bold py-2 px-6 rounded-full transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5 ' + (gameState === 'checking' ? 'hidden' : '') + '">' +
                        'Kumpul' +
                    '</button>' +
                '</div>' +
            '</div>';

            const instructionHtml = gameState === 'playing' ? 
                '<div class="text-xs text-center text-slate-500 mb-4 bg-white/60 p-2.5 rounded-lg border border-slate-200 font-medium shadow-inner">' +
                    'Pilih kata dari daftar untuk mengisi kalimat. Klik kata pada kalimat untuk membatalkan.' +
                '</div>' : '';

            let html = headerHtml +
                '<div class="flex flex-col md:flex-row flex-grow overflow-hidden relative">' +
                    '<div class="w-full md:w-2/3 h-1/2 md:h-full overflow-y-auto p-4 md:p-6 bg-slate-50/50 custom-scrollbar border-b md:border-b-0 md:border-r border-slate-200/60">' +
                        '<div class="space-y-4 max-w-3xl mx-auto pb-12">' + sentencesHtml + '</div>' +
                    '</div>' +
                    '<div class="w-full md:w-1/3 h-1/2 md:h-full flex flex-col bg-white/40 backdrop-blur-sm p-4 md:p-5">' +
                        '<div class="flex justify-between items-center border-b border-slate-300 pb-2 mb-3">' + 
                            '<h3 class="text-slate-600 font-black uppercase text-sm tracking-wider">Pilihan Kata</h3>' +
                            '<span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-0.5 rounded-full">' + availableWords.length + ' Sisa</span>' +
                        '</div>' +
                        instructionHtml +
                        '<div class="flex-grow overflow-y-auto custom-scrollbar content-start">' +
                            '<div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-2 lg:grid-cols-3 gap-2 md:gap-3">' + wordsHtml + '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
                
            gameContainer.innerHTML = html;
        }

        // --- INTERACTION LOGIC ---

        function handleBlankClick(index) {
            if (gameState !== 'playing') return;

            if (userAnswers[index] !== null) {
                userAnswers[index] = null;
                activeBlankIndex = index;
            } else {
                activeBlankIndex = index;
            }
            renderQuiz();
        }

        function handleWordClick(word) {
            if (gameState !== 'playing') return;

            if (activeBlankIndex !== null && userAnswers[activeBlankIndex] === null) {
                userAnswers[activeBlankIndex] = word;
                activeBlankIndex = null; 
            } else {
                const firstEmpty = userAnswers.indexOf(null);
                if (firstEmpty !== -1) {
                    userAnswers[firstEmpty] = word;
                } else {
                    return;
                }
            }
            
            if(activeBlankIndex === null) {
                 const nextEmpty = userAnswers.indexOf(null);
                 activeBlankIndex = nextEmpty !== -1 ? nextEmpty : null;
            }

            renderQuiz();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    submitQuiz(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timer-display');
            if (timerEl) {
                timerEl.textContent = formatTime(timeRemaining);
                if (timeRemaining <= 10 && !timerEl.classList.contains('time-warning')) {
                    timerEl.classList.add('time-warning', 'text-white', 'border-red-500');
                    timerEl.classList.remove('text-blue-400');
                }
            }
        }

        function formatTime(seconds) {
            if(seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // --- SCORING & STAGGERED ANIMATIONS ---

        async function submitQuiz(isForcedExit) {
            if (gameState !== 'playing') return;
            clearInterval(timerInterval);
            gameState = 'checking';
            renderQuiz();

            score = 0;
            wrongCount = 0;

            if (isForcedExit) {
                for (let i = 0; i < currentQuestions.length; i++) {
                    if (userAnswers[i] === currentQuestions[i].answer) score++;
                    else wrongCount++;
                }
                showFinalScore(true);
                return;
            }

            for (let i = 0; i < currentQuestions.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 250));
                
                const rowEl = document.getElementById(`row-${i}`);
                const slotEl = document.getElementById(`slot-${i}`);
                const isCorrect = userAnswers[i] === currentQuestions[i].answer;

                if (isCorrect) {
                    score++;
                    playCorrectSound();
                    if(rowEl && slotEl) {
                        rowEl.classList.replace('bg-white/70', 'bg-green-50');
                        rowEl.classList.replace('border-white', 'border-green-200');
                        slotEl.classList.remove('border-slate-400', 'text-slate-400', 'bg-slate-50', 'border-slate-300', 'text-slate-500');
                        slotEl.classList.add('text-green-700', 'border-green-400', 'bg-green-100', 'animate-bounce', 'shadow-sm');
                    }
                } else {
                    wrongCount++;
                    playWrongSound();
                    if(rowEl && slotEl) {
                        rowEl.classList.replace('bg-white/70', 'bg-red-50');
                        rowEl.classList.replace('border-white', 'border-red-200');
                        slotEl.classList.remove('border-slate-400', 'text-slate-400', 'bg-slate-50', 'border-slate-300', 'text-slate-500');
                        slotEl.classList.add('text-red-700', 'border-red-400', 'bg-red-100', 'animate-shake', 'shadow-sm');
                        
                        if (userAnswers[i] !== null) {
                            slotEl.innerHTML = `<span class="line-through opacity-50 mr-2 text-sm text-slate-500">${userAnswers[i]}</span>${currentQuestions[i].answer}`;
                        } else {
                             slotEl.innerHTML = `${currentQuestions[i].answer}`;
                        }
                    }
                }
                
                if (rowEl) {
                    rowEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
                }
            }

            setTimeout(() => {
                showFinalScore(false);
            }, 1500);
        }

        function showFinalScore(isForcedExit) {
            gameState = 'result';
            const totalQuestions = currentQuestions.length;
            const percentage = Math.round((score / totalQuestions) * 100);
            
            playFinishSound(percentage >= 60);

            let message = "";
            let colorClass = "";
            let bgClass = "";

            if (percentage === 100) {
                message = "Sempurna! Luar biasa.";
                colorClass = "text-green-600";
                bgClass = "bg-green-50 border-green-200";
            } else if (percentage >= 80) {
                message = "Sangat Baik!";
                colorClass = "text-blue-600";
                bgClass = "bg-blue-50 border-blue-200";
            } else if (percentage >= 60) {
                message = "Cukup baik, teruslah berlatih.";
                colorClass = "text-amber-600";
                bgClass = "bg-amber-50 border-amber-200";
            } else {
                message = "Perlu banyak belajar lagi.";
                colorClass = "text-red-600";
                bgClass = "bg-red-50 border-red-200";
            }

            if (isForcedExit) {
                message = "Kuis diakhiri karena pelanggaran (keluar tab/halaman)!";
                colorClass = "text-red-600";
                bgClass = "bg-red-50 border-red-200";
            } else if (timeRemaining <= 0) {
                message += " (Waktu Habis)";
            }

            let html = `
                <div class="flex flex-col items-center justify-center h-full w-full animate-fade-in text-center p-6 bg-white/40 backdrop-blur-sm">
                    <h2 class="text-4xl md:text-5xl font-black mb-6 ${colorClass} drop-shadow-sm">${isForcedExit ? 'Kuis Dihentikan' : 'Hasil Kuis Bab ' + currentLesson.lesson}</h2>
                    
                    <div class="${bgClass} p-8 rounded-3xl shadow-xl mb-6 w-full max-w-md border-2">
                        <div class="text-slate-500 text-sm mb-2 uppercase tracking-widest font-black">Persentase</div>
                        <div class="text-7xl font-black ${colorClass} mb-6 drop-shadow-md">${percentage}%</div>
                        
                        <div class="grid grid-cols-2 gap-4 text-center divide-x divide-slate-300 border-t border-slate-300 pt-6">
                            <div>
                                <div class="text-slate-500 text-xs uppercase tracking-wider mb-2 font-bold">Benar</div>
                                <div class="text-4xl font-black text-green-500">${score}</div>
                            </div>
                            <div>
                                <div class="text-slate-500 text-xs uppercase tracking-wider mb-2 font-bold">Salah / Kosong</div>
                                <div class="text-4xl font-black text-red-500">${wrongCount}</div>
                            </div>
                        </div>
                    </div>
                    
                    <p class="text-xl text-slate-700 mb-10 font-bold max-w-lg bg-white/70 px-6 py-3 rounded-full shadow-sm">"${message}"</p>
                    
                    <div class="flex flex-col sm:flex-row gap-4">
                        <button onclick="renderMainMenu()" class="bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-600 hover:to-indigo-600 text-white font-bold py-4 px-8 rounded-full shadow-lg transition duration-200 transform hover:-translate-y-1 flex items-center text-lg">
                            <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                            Menu Utama
                        </button>
                        ${!isForcedExit ? `
                        <button onclick="showReview()" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-bold py-4 px-8 rounded-full shadow-lg transition duration-200 transform hover:-translate-y-1 flex items-center text-lg">
                            <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            Lihat Pembahasan
                        </button>
                        ` : ''}
                    </div>
                </div>
            `;
            gameContainer.innerHTML = html;
        }

        function showReview() {
            gameState = 'review';
            
            let reviewHtml = currentQuestions.map((q, i) => {
                const isCorrect = userAnswers[i] === q.answer;
                const userAnswerText = userAnswers[i] || 'Tidak dijawab';
                const completedSentence = q.sentence.replace('___', '<span class="font-black text-blue-600 border-b-2 border-blue-400 mx-1 px-1">' + q.answer + '</span>');
                
                return '<div class="mb-5 p-5 rounded-2xl border-2 ' + (isCorrect ? 'bg-green-50/80 border-green-200' : 'bg-red-50/80 border-red-200') + ' shadow-sm relative">' +
                    '<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-3 gap-2">' +
                        '<div class="flex items-center">' +
                            '<span class="' + (isCorrect ? 'text-green-700 bg-green-200/60 border-green-300' : 'text-red-700 bg-red-200/60 border-red-300') + ' font-black px-3 py-1 rounded-full text-xs border mr-3">' +
                                (isCorrect ? '✓ Benar' : '✗ Salah') +
                            '</span>' +
                            (!isCorrect ? '<span class="text-sm font-bold text-slate-500">Jawaban Anda: <span class="line-through underline decoration-red-400 decoration-2 text-red-500">' + userAnswerText + '</span></span>' : '') +
                        '</div>' +
                        '<div class="text-xs font-black text-slate-400">Soal ' + (i + 1) + '</div>' +
                    '</div>' +
                    '<div class="text-xl md:text-2xl text-slate-800 mb-2 font-medium tracking-wide">' + completedSentence + '</div>' +
                    '<div class="text-sm md:text-base text-slate-600 italic mb-4 font-medium leading-relaxed">"' + q.sentenceMeaning + '"</div>' +
                    '<div class="bg-white/90 p-4 rounded-xl flex flex-wrap gap-x-6 gap-y-3 text-sm md:text-base border border-white shadow-inner">' +
                        '<div class="flex items-center"><span class="font-black text-slate-400 uppercase text-xs mr-2">Jawaban yang tepat:</span> <span class="font-bold text-slate-800 text-lg">' + q.answer + '</span></div>' +
                        '<div class="flex items-center"><span class="font-black text-slate-400 uppercase text-xs mr-2">Pinyin:</span> <span class="font-bold text-blue-600">' + q.pinyin + '</span></div>' +
                        '<div class="flex items-center w-full sm:w-auto"><span class="font-black text-slate-400 uppercase text-xs mr-2">Arti:</span> <span class="font-medium text-slate-700">' + q.meaning + '</span></div>' +
                    '</div>' +
                '</div>';
            }).join('');

            let html = '<div class="flex flex-col h-full w-full animate-fade-in bg-white/40 backdrop-blur-sm">' +
                '<div class="h-16 bg-white/90 backdrop-blur-md border-b border-slate-200/60 flex items-center justify-between px-6 shrink-0 shadow-sm z-10">' +
                    '<h2 class="text-xl font-black text-slate-800 flex items-center"><svg class="w-6 h-6 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg> Pembahasan Bab ' + currentLesson.lesson + '</h2>' +
                    '<button onclick="renderMainMenu()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 px-6 rounded-full transition shadow-md text-sm">Kembali ke Menu</button>' +
                '</div>' +
                '<div class="flex-grow overflow-y-auto p-4 md:p-6 custom-scrollbar">' +
                    '<div class="max-w-4xl mx-auto space-y-4 pb-12">' + reviewHtml + '</div>' +
                '</div>' +
            '</div>';
            
            gameContainer.innerHTML = html;
        }

        // Custom scrollbar styling
        const style = document.createElement('style');
        style.textContent = `
            .custom-scrollbar::-webkit-scrollbar { width: 8px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.4); border-radius: 4px; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.5); border-radius: 4px; }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.7); }
        `;
        document.head.appendChild(style);

        // Initialize App
        window.onload = renderMainMenu;

    </script>
</body>
</html>
